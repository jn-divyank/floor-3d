<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#121418" />
<title>3 BHK Residence · Gurugram — 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#f3efe7;--mute:rgba(243,239,231,.62);--gold:#c9a46a;--glass:rgba(20,22,26,.58);--line:rgba(255,255,255,.09);
    --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e5de;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
  #app,#app canvas{position:fixed;inset:0;touch-action:none;outline:none}
  .glass{background:var(--glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1px solid var(--line);box-shadow:0 10px 30px rgba(10,12,16,.18)}
  button{font-family:inherit;color:inherit;cursor:pointer}

  /* loader */
  #loader{position:fixed;inset:0;z-index:50;background:#111316;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity 1s ease .2s,visibility 0s 1.2s}
  #loader.done{opacity:0;visibility:hidden}
  #loader .eyebrow{font:500 10.5px var(--sans);letter-spacing:.32em;color:var(--gold)}
  #loader h1{margin:0;font:500 38px var(--serif);letter-spacing:.02em;color:var(--ink)}
  #loader .bar{width:140px;height:1px;background:rgba(255,255,255,.12);overflow:hidden}
  #loader .bar:after{content:"";display:block;height:100%;width:40%;background:var(--gold);animation:load 1.1s ease-in-out infinite}
  @keyframes load{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

  /* labels */
  #labels{position:fixed;inset:0;pointer-events:none;transition:opacity .35s}
  #labels.hide{opacity:0}
  #labels.compact .lbl span{display:none}
  #labels.compact .lbl{padding:5px 10px}
  .lbl{position:absolute;left:0;top:0;padding:6px 11px 6px 10px;border-radius:10px;white-space:nowrap;line-height:1.2;
    background:rgba(255,255,255,.9);color:#1d2025;box-shadow:0 6px 18px rgba(20,24,30,.16);border:1px solid rgba(255,255,255,.7)}
  .lbl b{display:block;font:600 11.5px var(--sans);letter-spacing:.06em;text-transform:uppercase}
  .lbl span{display:block;font:400 10.5px var(--sans);color:#6a6f76;margin-top:1px}
  .lbl.small{padding:3px 8px}.lbl.small b{font-size:9.5px}.lbl.small span{font-size:9px}
  .lbl.ground{background:rgba(22,24,28,.7);color:#fff;border-color:rgba(255,255,255,.12)}.lbl.ground span{color:#cfd3d8}
  .lbl.clickable{pointer-events:auto;cursor:pointer}
  .lbl.clickable:before{content:"";position:absolute;left:50%;bottom:-4px;width:7px;height:7px;margin-left:-3.5px;background:inherit;transform:rotate(45deg);border-right:1px solid rgba(255,255,255,.7);border-bottom:1px solid rgba(255,255,255,.7)}
  body.night .lbl{background:rgba(24,26,31,.82);color:var(--ink);border-color:var(--line)}
  body.night .lbl span{color:var(--mute)}

  /* brand */
  #brand{position:fixed;left:14px;top:calc(14px + env(safe-area-inset-top));padding:14px 16px 13px;border-radius:16px;max-width:min(330px,calc(100vw - 86px))}
  #brand .eyebrow{font:500 9.5px var(--sans);letter-spacing:.28em;color:var(--gold);text-transform:uppercase}
  #brand h1{margin:5px 0 8px;font:500 26px/1.05 var(--serif);letter-spacing:.01em}
  #brand .stats{display:flex;flex-wrap:wrap;gap:6px 14px;font:400 11px var(--sans);color:var(--mute)}
  #brand .stats b{color:var(--ink);font-weight:600}

  /* tools */
  #tools{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px}
  .icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;padding:0;transition:background .2s,color .2s}
  .icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
  .icon.on{background:rgba(201,164,106,.92);color:#16181b;border-color:transparent}
  .icon.on svg{opacity:1}
  #compass{width:44px;height:44px;border-radius:50%;position:relative;margin-top:4px}
  #needle{position:absolute;inset:0}
  #needle:before{content:"";position:absolute;left:50%;top:7px;margin-left:-4px;border:4px solid transparent;border-bottom:13px solid var(--gold);border-top:0}
  #needle:after{content:"N";position:absolute;left:0;right:0;top:23px;text-align:center;font:600 9px var(--sans);letter-spacing:.1em;color:var(--ink)}

  /* toast */
  #toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-8px);opacity:0;padding:8px 14px;border-radius:999px;font:500 11.5px var(--sans);white-space:nowrap;transition:.35s;pointer-events:none;z-index:5}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-width:700px){#toast{top:auto;bottom:calc(150px + env(safe-area-inset-bottom))}}
  @media (max-width:700px){body.touring #toast{top:calc(14px + env(safe-area-inset-top));bottom:auto}}

  /* bottom dock */
  #dock{position:fixed;left:0;right:0;bottom:0;padding:0 0 calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;align-items:center}
  .seg{display:flex;gap:4px;padding:4px;border-radius:999px}
  .seg button{border:0;background:transparent;padding:9px 16px;border-radius:999px;font:500 12.5px var(--sans);letter-spacing:.02em;display:flex;align-items:center;gap:7px;color:var(--mute);transition:.2s}
  .seg button.on{background:var(--ink);color:#16181b}
  .seg button svg{width:13px;height:13px;fill:currentColor}
  #cards{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 2px;max-width:100%;scrollbar-width:none;scroll-snap-type:x proximity}
  #cards::-webkit-scrollbar{display:none}
  .card{flex:0 0 auto;text-align:left;border-radius:14px;padding:10px 14px 9px;min-width:112px;scroll-snap-align:center;transition:.2s;
    background:var(--glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1px solid var(--line)}
  .card b{display:block;font:500 15px/1.1 var(--serif);letter-spacing:.01em;color:var(--ink)}
  .card span{display:block;font:400 10.5px var(--sans);color:var(--mute);margin-top:3px;letter-spacing:.03em}
  .card.on{background:rgba(243,239,231,.95);border-color:transparent}
  .card.on b{color:#16181b}.card.on span{color:#6b6458}

  /* sheet */
  #sheet{position:fixed;left:50%;bottom:calc(126px + env(safe-area-inset-bottom));width:min(420px,calc(100vw - 28px));transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:.4s cubic-bezier(.2,.8,.2,1);border-radius:18px;padding:15px 16px 13px}
  #sheet.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #sheet .eyebrow{font:500 9.5px var(--sans);letter-spacing:.26em;color:var(--gold);text-transform:uppercase}
  #shName{margin:4px 0 2px;font:500 25px/1.1 var(--serif)}
  #shMeta{font:500 11px var(--sans);color:var(--mute);letter-spacing:.03em}
  #shDesc{margin:9px 0 12px;font:400 12.5px/1.5 var(--sans);color:rgba(243,239,231,.85)}
  .row{display:flex;gap:8px;align-items:center}
  .btn{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:12px;padding:9px 14px;font:500 12px var(--sans)}
  .btn.primary{background:var(--ink);color:#16181b;border-color:transparent;flex:1}
  .btn.round{width:40px;padding:9px 0;text-align:center}
  #shWalk,#shClose{display:none}
  body.touring #cards{display:none}
  body.touring #sheet{bottom:calc(68px + env(safe-area-inset-bottom))}
  @media (max-width:500px){#shName{font-size:22px}#shDesc{font-size:11.5px;margin:6px 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}#sheet{padding:12px 14px 11px}}
  #sheet.selecting #shWalk,#sheet.selecting #shClose{display:block}
  #sheet.selecting .nav{display:none}
  #brand{transition:opacity .4s,transform .4s}
  body.touring #brand{opacity:0;transform:translateY(-12px);pointer-events:none}
  @media (max-width:500px){#brand h1{font-size:21px;margin:3px 0 5px}#brand{padding:10px 13px 10px}#brand .stats{font-size:10.5px;gap:3px 10px}
    .lbl{padding:4px 8px}.lbl b{font-size:10px}.lbl span{font-size:9.5px}.card{min-width:100px;padding:9px 12px 8px}.card b{font-size:14px}}
  @media (max-height:520px){#cards{display:none}#sheet{bottom:calc(64px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="brand" class="glass">
  <div class="eyebrow">Gurugram · Builder floor</div>
  <h1>3 BHK Residence</h1>
  <div class="stats"><span><b>≈1,040</b> sq ft carpet</span><span><b>26'3" × 62'4"</b> plot</span><span>West facing · Lift</span></div>
</div>

<div id="tools">
  <button id="btnNight" class="icon glass" title="Day / Evening"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
  <button id="btnWalls" class="icon glass" title="Full-height walls"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 20V9l7-5 7 5v11M9 20v-6h6v6"/></svg></button>
  <button id="btnFurn" class="icon glass on" title="Furniture"><svg viewBox="0 0 24 24"><path d="M4 18v-5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v5M4 18h16M6 11V8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v3M6 18v2M18 18v2"/></svg></button>
  <button id="btnLabels" class="icon glass on" title="Labels"><svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8" r="1.4"/></svg></button>
  <div id="compass" class="glass"><div id="needle"></div></div>
</div>

<div id="toast" class="glass"></div>

<div id="sheet" class="glass">
  <div class="eyebrow">Room</div>
  <div id="shName"></div>
  <div id="shMeta"></div>
  <div id="shDesc"></div>
  <div class="row">
    <button id="shPrev" class="btn round nav" aria-label="Previous room">‹</button>
    <button id="shNext" class="btn primary nav">Next room ›</button>
    <button id="shExit" class="btn nav">Exit</button>
    <button id="shWalk" class="btn primary">Walk inside</button>
    <button id="shClose" class="btn">Close</button>
  </div>
</div>

<div id="dock">
  <div class="seg glass">
    <button data-view="overview">3D</button>
    <button data-view="top">Plan</button>
    <button id="btnPlay"><svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg>Tour</button>
  </div>
  <div id="cards"></div>
</div>

<div id="loader"><div class="eyebrow">GURUGRAM</div><h1>3 BHK Residence</h1><div class="bar"></div></div>
